name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, journalhero-black-red ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          validate-wrappers: false
      - name: Bundle Dragon Age II poster for offline use
        run: |
          curl --fail --location --retry 3 --retry-delay 2 "https://cdn.qukasoft.com/f/990724/cG96YWFtNG0vcUp3ZUdGckg4OG5icmdQYmNFPQ/p/dragon-age-2-42306010.png" --output app/src/main/assets/web/dragon-age-2-poster.png
          test -s app/src/main/assets/web/dragon-age-2-poster.png
          file app/src/main/assets/web/dragon-age-2-poster.png
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JournalHero-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
