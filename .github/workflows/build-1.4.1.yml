name: Build Journal Hero 1.4.1

on:
  push:
    branches: [main]
    paths:
      - JournalHero-1.4.1-Project.zip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          test -s JournalHero-1.4.1-Project.zip
          unzip -t JournalHero-1.4.1-Project.zip

      - name: Extract version 1.4.1 project
        run: |
          mkdir -p /tmp/journalhero-141
          unzip -q JournalHero-1.4.1-Project.zip -d /tmp/journalhero-141
          test -f /tmp/journalhero-141/app/build.gradle
          grep -q "versionName '1.4.1'" /tmp/journalhero-141/app/build.gradle
          grep -q "versionCode 14" /tmp/journalhero-141/app/build.gradle
          cp -a /tmp/journalhero-141/. .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK metadata
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "Built APK from Journal Hero version 1.4.1 (versionCode 14)."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JournalHero-1.4.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
