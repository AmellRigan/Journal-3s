name: Build Journal Hero 1.4.1

on:
  push:
    branches: [main]
    paths:
      - JournalHero-1.4.1-Project.zip
      - .github/workflows/build-1.4.1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source archive
        run: |
          test -s JournalHero-1.4.1-Project.zip
          unzip -t JournalHero-1.4.1-Project.zip

      - name: Extract version 1.4.1 project
        run: |
          mkdir -p /tmp/journalhero-141
          unzip -q JournalHero-1.4.1-Project.zip -d /tmp/journalhero-141
          test -f /tmp/journalhero-141/app/build.gradle
          grep -q "versionName '1.4.1'" /tmp/journalhero-141/app/build.gradle
          grep -q "versionCode 14" /tmp/journalhero-141/app/build.gradle
          cp -a /tmp/journalhero-141/. .

      - name: Fix Android build compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          if 'buildConfig true' not in s:
              lines = s.splitlines()
              for i, line in enumerate(lines):
                  if line.strip().startswith('compileSdk '):
                      lines[i+1:i+1] = ['', '    buildFeatures {', '        buildConfig true', '    }']
                      s = '\n'.join(lines) + '\n'
                      break
              else:
                  raise SystemExit('Could not find compileSdk declaration')
          if 'exclude group: \'org.jetbrains.kotlin\', module: \'kotlin-stdlib-jdk7\'' not in s:
              s += "\n\nconfigurations.configureEach {\n    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'\\n    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'\n}\n"
          p.write_text(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK metadata
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "Built APK from Journal Hero version 1.4.1 (versionCode 14)."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JournalHero-1.4.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
