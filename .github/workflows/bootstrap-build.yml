name: Restore and Build Journal Hero

on:
  workflow_dispatch:
  push:
    paths:
      - "_journalhero_payload/**"
      - ".github/workflows/bootstrap-build.yml"

permissions:
  contents: read

jobs:
  restore-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore complete source archive
        shell: bash
        run: |
          cat _journalhero_payload/part1.b64 _journalhero_payload/part2.b64 _journalhero_payload/part3.b64 | base64 -d > /tmp/journalhero.tar.gz
          mkdir -p /tmp/journalhero
          tar -xzf /tmp/journalhero.tar.gz -C /tmp/journalhero
          cp -a /tmp/journalhero/. .
          rm -rf _journalhero_payload
          test -s app/src/main/assets/web/index.html
          test -s app/src/main/java/com/hero/journal/MainActivity.java

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JournalHero-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
